<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card Test</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 22% 18%, rgba(255, 145, 244, 0.34), transparent 24%),
        radial-gradient(circle at 78% 72%, rgba(61, 95, 255, 0.38), transparent 24%),
        linear-gradient(135deg, #7b45f1 0%, #4320ba 100%);
    }

    .card-wrap {
      width: min(78vw, 520px);
      aspect-ratio: 0.9;
      display: grid;
      place-items: center;
      transform: rotate(-6deg);
    }

    .card {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100%;
      padding: 13% 12% 10%;
      border: 1px solid rgba(255, 255, 255, 0.26);
      border-radius: 10%;
      overflow: hidden;
      color: #ffffff;
      background:
        radial-gradient(ellipse at 52% 14%, rgba(255, 255, 255, 0.34), transparent 38%),
        radial-gradient(ellipse at 24% 20%, rgba(255, 255, 255, 0.2), transparent 24%),
        linear-gradient(180deg, #ff96df 0%, #f338a8 58%, #ec2496 100%);
      box-shadow:
        inset 0 3px 8px rgba(255, 255, 255, 0.42),
        inset 0 -10px 20px rgba(165, 22, 138, 0.22),
        0 14px 0 #5530c2,
        0 22px 24px rgba(31, 11, 107, 0.36);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 8%;
      box-shadow:
        inset 0 2px 4px rgba(255, 255, 255, 0.16),
        inset 0 -2px 5px rgba(124, 15, 121, 0.12);
      pointer-events: none;
    }

    .card::after {
      content: "";
      position: absolute;
      left: 12%;
      right: 12%;
      top: 5%;
      height: 32%;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.32), rgba(255, 255, 255, 0));
      filter: blur(1px);
      pointer-events: none;
    }

    .badge {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 42%;
      aspect-ratio: 1;
      margin: 0 auto 10%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 24%, rgba(255, 255, 255, 0.72), transparent 24%),
        linear-gradient(180deg, rgba(255, 238, 250, 0.8), rgba(245, 132, 211, 0.62));
      box-shadow:
        inset 0 4px 12px rgba(255, 255, 255, 0.34),
        inset 0 -8px 18px rgba(193, 44, 158, 0.12),
        0 9px 14px rgba(137, 19, 128, 0.16);
    }

    .heart {
      width: 33%;
      aspect-ratio: 1;
      position: relative;
      transform: rotate(-45deg);
      background: linear-gradient(135deg, #ff4fa1 0%, #f22382 100%);
      border-radius: 18% 0 18% 18%;
      box-shadow: 0 8px 10px rgba(164, 20, 112, 0.2);
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: inherit;
    }

    .heart::before {
      top: -50%;
      left: 0;
    }

    .heart::after {
      top: 0;
      right: -50%;
    }

    .copy {
      position: absolute;
      left: 12%;
      right: 26%;
      bottom: 9%;
      z-index: 1;
      display: grid;
      gap: 5%;
      transform: rotate(-1deg);
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 7vw, 62px);
      line-height: 0.96;
      font-weight: 900;
      letter-spacing: -0.03em;
      text-shadow: 0 4px 0 rgba(133, 23, 130, 0.18);
    }

    p {
      width: 88%;
      margin: 0;
      font-size: clamp(18px, 3.6vw, 29px);
      line-height: 1.18;
      font-weight: 700;
      text-shadow: 0 2px 0 rgba(133, 23, 130, 0.12);
    }

    .arrow {
      position: absolute;
      right: 9%;
      bottom: 10%;
      z-index: 2;
      width: 22%;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.6), transparent 28%),
        linear-gradient(180deg, #ff83d8 0%, #ef2c9c 100%);
      box-shadow:
        inset 0 4px 10px rgba(255, 255, 255, 0.36),
        inset 0 -7px 12px rgba(138, 20, 132, 0.2),
        0 5px 0 rgba(113, 25, 140, 0.38),
        0 8px 14px rgba(73, 14, 113, 0.24);
    }

    .arrow::before,
    .arrow::after {
      content: "";
      position: absolute;
      top: 48%;
      right: 25%;
      height: 10%;
      border-radius: 999px;
      background: #ffffff;
      transform-origin: right center;
    }

    .arrow::before {
      width: 48%;
      transform: translateY(-50%);
    }

    .arrow::after {
      width: 28%;
      transform: translateY(-50%) rotate(45deg);
      box-shadow: 0 -18px 0 #ffffff;
    }
  </style>
</head>
<body>
  <main class="card-wrap">
    <section class="card" aria-label="Что любишь ты?">
      <div class="badge" aria-hidden="true">
        <div class="heart"></div>
      </div>
      <div class="copy">
        <h1>Что любишь<br>ты?</h1>
        <p>Выбирай пары и открывай категории для угадывания</p>
      </div>
      <div class="arrow" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>
